[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eosquality"
version = "0.2.0"
description = "Assess the quality of query data against a fitted reference population"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
  {name="Ersilia Open Source Initiative", email="hello@ersilia.io"}
]
requires-python = ">=3.11"
keywords = ["ersilia", "applicability-domain", "cheminformatics", "quality-assessment"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
  "click==8.3.2",
  "eosframes==1.2.0",
  "FPSim2==0.7.4",
  "loguru==0.7.3",
  "numpy==2.4.4",
  "packaging==26.0",
  "pandas==3.0.2",
  "psutil==7.2.2",
  "rdkit==2026.3.1",
  "rich==15.0.0",
  "scikit-learn==1.8.0",
  "scipy==1.17.1",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.3.0",
  "pytest==9.0.3",
  "ruff==0.15.11",
]
# Figure scripts under scripts/figures/ (stylia brings matplotlib)
viz = [
  "stylia==1.0.1",
]

[project.urls]
Repository = "https://github.com/ersilia-os/eosquality"
Issues = "https://github.com/ersilia-os/eosquality/issues"
Documentation = "https://github.com/ersilia-os/eosquality/tree/main/docs"

[project.scripts]
eosquality = "eosquality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eosquality = ["py.typed"]
"eosquality.library" = ["physchem_scaler.json"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
# Org standard (D101, D102, E4, E9, F, I, W) plus bugbear (B) and pyupgrade (UP).
select = ["B", "D101", "D102", "E4", "E9", "F", "I", "UP", "W"]
ignore = ["D104", "D105", "D107"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["eosquality"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D101", "D102"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 50

[tool.pytest.ini_options]
testpaths = ["tests"]
